<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Escanear QR</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f1ed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #292522;
    }

    .contenedor {
      width: 100%;
      max-width: 430px;
    }

    .tarjeta {
      background: #ffffff;
      border: 1px solid #e5e0da;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .institucion {
      text-align: center;
      color: #292522;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.5;
    }

    .linea {
      width: 45px;
      height: 2px;
      background: #80624b;
      margin: 22px auto 28px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      font-weight: 600;
      margin: 0 0 10px;
    }

    .texto {
      text-align: center;
      color: #8a837c;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    #lectorQR {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    .volver {
      width: 100%;
      height: 46px;
      margin-top: 18px;
      border: 1px solid #dcd6d0;
      border-radius: 10px;
      background: #ffffff;
      color: #514a44;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .volver:hover {
      background: #f7f4f1;
      transform: translateY(-1px);
    }

    .volver:active {
      transform: translateY(0);
    }

  </style>

</head>

<body>

  <div class="contenedor">

    <div class="tarjeta">

      <div class="institucion">

        INSTITUCIÓN EDUCATIVA 7701<br>
        "NUESTRA SEÑORA DEL CARMEN"

      </div>

      <div class="linea"></div>

      <h1>
        Escanear código QR
      </h1>

      <div class="texto">

        Apunta la cámara hacia el código QR del alumno.

      </div>

      <div id="lectorQR"></div>

      <button
        class="volver"
        onclick="volverAlPanel()">

        Volver al panel

      </button>

    </div>

  </div>


  <script>

    // ==================================================
    // URL CORRECTA DEL PANEL DE PROFESORES
    // ==================================================

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbwNwcizIghVwKUjZB-kdZEkWG1uewXd2VVaP_AFascrsH2NtFZ0ygN_4juO7L8n-Lbm/exec";


    let scanner = null;


    // ==================================================
    // INICIAR LECTOR
    // ==================================================

    window.addEventListener(
      "load",
      iniciarScanner
    );


    function iniciarScanner() {

      scanner =
        new Html5Qrcode("lectorQR");


      const configuracion = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      };


      scanner
        .start(

          {
            facingMode: "environment"
          },

          configuracion,

          function(texto) {

            procesarQR(texto);

          },

          function(error) {

            // Error normal mientras busca el QR.

          }

        )

        .catch(function(error) {

          document
            .getElementById("lectorQR")
            .innerHTML = `

              <div style="
                text-align:center;
                padding:20px;
                color:#8a4038;
                font-size:14px;
                line-height:1.6;
              ">

                No se pudo acceder a la cámara.

                <br><br>

                Comprueba que el navegador
                tenga permiso para usar la cámara.

              </div>

          `;

          console.error(error);

        });

    }


    // ==================================================
    // PROCESAR QR
    // ==================================================

    function procesarQR(texto) {

      detenerScanner();


      let id = "";


      try {

        const url =
          new URL(texto);

        id =
          url.searchParams.get("id") || "";

      }

      catch(error) {

        id =
          String(texto || "").trim();

      }


      id =
        String(id)
          .trim()
          .replace(/\D/g, "");


      if (!id) {

        alert(
          "El código QR no contiene un ID válido."
        );

        location.reload();

        return;

      }


      // ==================================================
      // ENVIAR AL GOOGLE APPS SCRIPT NUEVO
      // ==================================================

      window.location.href =
        URL_APPS_SCRIPT +
        "?id=" +
        encodeURIComponent(id);

    }


    // ==================================================
    // DETENER SCANNER
    // ==================================================

    function detenerScanner() {

      if (!scanner) {
        return;
      }


      scanner
        .stop()
        .then(function() {

          try {
            scanner.clear();
          }
          catch(error) {}

          scanner = null;

        })
        .catch(function() {

          scanner = null;

        });

    }


    // ==================================================
    // VOLVER AL PANEL
    // ==================================================

    function volverAlPanel() {

      detenerScanner();


      // SIEMPRE REGRESA AL APPS SCRIPT NUEVO

      window.location.href =
        URL_APPS_SCRIPT;

    }

  </script>

</body>

</html>
